# Render — Static Site config for opticwise.com
#
# Deployment model: this repo is the canonical source. Each push to the deploy
# branch triggers Render to publish the directory contents (no build step).
#
# - Forms post directly to https://ownet.opticwise.com/api/public/forms/<slug>
#   (CRM lives at the same Render org). CORS is configured server-side to
#   allow this origin.
# - Page interactivity is plain HTML/CSS + /site.js + /forms-embed.js. No
#   Next.js bundle, no React hydration.
# - Sitemap, robots.txt, and JSON-LD are all hand-edited in this repo.
#
# Reference: https://render.com/docs/static-sites
services:
  - type: web
    name: opticwise-marketing
    runtime: static
    # No build step — publish the working directory as-is. If a build is ever
    # added (e.g., to compile Tailwind or run a linter), set buildCommand here.
    buildCommand: ""
    staticPublishPath: .

    # Pretty URLs: /about/ resolves to /about/index.html. This matches the
    # canonical URL form (`https://www.opticwise.com/about/` with trailing
    # slash) emitted by .audit/strip-nextjs.mjs.
    pullRequestPreviewsEnabled: true

    headers:
      # — Security headers, applied site-wide ————————————————————————————
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), interest-cohort=()
      # X-Frame-Options is legacy; modern equivalent is `frame-ancestors` in
      # CSP. We keep both for broad UA support.
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      # Content Security Policy. Permissive enough to keep working today
      # (Google Fonts + form POST to ownet) but sealed against drive-by
      # script execution. Tighten when no longer needed.
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline' https://www.googletagmanager.com;
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com data:;
          img-src 'self' https: data:;
          connect-src 'self' https://ownet.opticwise.com https://www.google-analytics.com https://*.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com;
          form-action 'self' https://ownet.opticwise.com;
          frame-ancestors 'self';
          base-uri 'self';
          object-src 'none'

      # — Cache control ———————————————————————————————————————————————————
      # HTML pages: revalidate every visit so edits ship immediately when the
      # CDN refreshes. Render edge caches static assets aggressively by
      # default; we override here for HTML.
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /
        name: Cache-Control
        value: public, max-age=0, must-revalidate

      # Long-cache for static assets that change rarely. Still revalidates
      # via ETag, but avoids per-request body transfers.
      - path: /styles.css
        name: Cache-Control
        value: public, max-age=3600, must-revalidate
      - path: /site.css
        name: Cache-Control
        value: public, max-age=3600, must-revalidate
      - path: /site.js
        name: Cache-Control
        value: public, max-age=3600, must-revalidate
      - path: /forms-embed.css
        name: Cache-Control
        value: public, max-age=3600, must-revalidate
      - path: /forms-embed.js
        name: Cache-Control
        value: public, max-age=3600, must-revalidate

      # Images and downloadables — long cache, revalidate on change.
      - path: /images/*
        name: Cache-Control
        value: public, max-age=86400, immutable
      - path: /api/media/file/*
        name: Cache-Control
        value: public, max-age=86400, immutable

      # Sitemap + robots: short TTL so SEO updates propagate.
      - path: /sitemap.xml
        name: Cache-Control
        value: public, max-age=3600
      - path: /robots.txt
        name: Cache-Control
        value: public, max-age=3600

    # 404 fallback: Render automatically serves /404.html for unmatched paths
    # in static-site deployments — no explicit config needed. The custom 404
    # page lives at the repo root.
    #
    # Pretty-URL routing: Render serves /about/index.html when the URL is
    # either /about or /about/. Marketing canonical URLs use the trailing-
    # slash form (`/about/`); both URLs resolve to the same page, and
    # <link rel="canonical"> in each page's <head> tells search engines
    # which one to index.
