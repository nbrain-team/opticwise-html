# Render — Static Site config for opticwise.com
#
# Deployment model: this repo is the canonical source. Each push to the deploy
# branch triggers Render to publish static files.
#
# After each successful sync, Render runs IndexNow ping (scripts/indexnow-ping.mjs).
# Verification key lives at repo root under https://www.opticwise.com/{KEY}.txt
#
# Forms post directly to https://ownet.opticwise.com/api/public/forms/<slug>
#
# - Forms post directly to https://ownet.opticwise.com/api/public/forms/<slug>
#   (CRM lives at the same Render org). CORS is configured server-side to
#   allow this origin.
# - Page interactivity is plain HTML/CSS + /site.js + /forms-embed.js. No
#   Next.js bundle, no React hydration.
# - Sitemap, robots.txt, and JSON-LD are all hand-edited in this repo.
#
# Reference: https://render.com/docs/static-sites
services:
  - type: web
    name: opticwise-marketing
    runtime: static
    # No build step — publish the working directory as-is. If a build is ever
    # added (e.g., to compile Tailwind or run a linter), set buildCommand here.
    buildCommand: ""
    staticPublishPath: .

    # Pretty URLs: /about/ resolves to /about/index.html. This matches the
    # canonical URL form (`https://www.opticwise.com/about/` with trailing
    # slash) emitted by .audit/strip-nextjs.mjs.
    pullRequestPreviewsEnabled: true

    headers:
      # — Security headers, applied site-wide ————————————————————————————
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), interest-cohort=()
      # X-Frame-Options is legacy; modern equivalent is `frame-ancestors` in
      # CSP. We keep both for broad UA support.
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      # Content Security Policy. Permissive enough to keep working today
      # (Google Fonts + form POST to ownet) but sealed against drive-by
      # script execution. Tighten when no longer needed.
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://player.vimeo.com;
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com data:;
          img-src 'self' https: data:;
          connect-src 'self' https://ownet.opticwise.com https://www.google-analytics.com https://*.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com;
          form-action 'self' https://ownet.opticwise.com;
          frame-src 'self' https://player.vimeo.com;
          frame-ancestors 'self';
          base-uri 'self';
          object-src 'none'

      # — Cache control ———————————————————————————————————————————————————
      # HTML pages: revalidate every visit so edits ship immediately when the
      # CDN refreshes. Render edge caches static assets aggressively by
      # default; we override here for HTML.
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /
        name: Cache-Control
        value: public, max-age=0, must-revalidate

      # Long-cache for static assets that change rarely. Still revalidates
      # via ETag, but avoids per-request body transfers.
      - path: /styles.css
        name: Cache-Control
        value: public, max-age=3600, must-revalidate
      - path: /site.css
        name: Cache-Control
        value: public, max-age=3600, must-revalidate
      - path: /site.js
        name: Cache-Control
        value: public, max-age=3600, must-revalidate
      - path: /forms-embed.css
        name: Cache-Control
        value: public, max-age=3600, must-revalidate
      # Short TTL for /forms-embed.js — it's the modal-launcher shim that
      # composes with the official OWNet embed loader. Keeping the TTL low
      # means a behaviour fix here propagates within minutes instead of
      # waiting an hour. Each HTML page also stamps ?v=N on the src so a
      # version bump invalidates browser caches immediately.
      - path: /forms-embed.js
        name: Cache-Control
        value: public, max-age=60, must-revalidate

      # Images and downloadables — long cache, revalidate on change.
      - path: /images/*
        name: Cache-Control
        value: public, max-age=86400, immutable
      - path: /api/media/file/*
        name: Cache-Control
        value: public, max-age=86400, immutable

      # — Private deliverables (gated assets) ————————————————————————————
      # `/downloads/*` holds PDFs (and similar) we hand out via email or
      # form-completion follow-up (e.g. PPP Starter Kit). The URLs are
      # publicly reachable so the recipient can click them, but we don't
      # want them surfacing in Google / Bing / AI assistants. The
      # `X-Robots-Tag: noindex, nofollow` header is the canonical way to
      # tell every crawler to drop the URL from its index — including
      # PDFs, which can't carry a <meta robots> tag. Intentionally NOT
      # disallowed in robots.txt: disallow would block crawlers from
      # reading this header, which can leave "URL-only" stub entries in
      # Google if anyone ever backlinks the file. noindex is the cleaner
      # signal.
      - path: /downloads/*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /downloads/*
        name: Cache-Control
        value: public, max-age=86400, must-revalidate

      # Sitemap + robots: short TTL so SEO updates propagate.
      - path: /sitemap.xml
        name: Cache-Control
        value: public, max-age=3600
      - path: /robots.txt
        name: Cache-Control
        value: public, max-age=3600

      # llms.txt + llms-full.txt — AI-engine discovery surfaces. Plain text,
      # short TTL so updates propagate as quickly as sitemap/robots.
      - path: /llms.txt
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /llms.txt
        name: Cache-Control
        value: public, max-age=3600
      - path: /llms-full.txt
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /llms-full.txt
        name: Cache-Control
        value: public, max-age=3600

    # 404 fallback: Render automatically serves /404.html for unmatched paths
    # in static-site deployments — no explicit config needed. The custom 404
    # page lives at the repo root.
    #
    # Pretty-URL routing: Render serves /about/index.html when the URL is
    # either /about or /about/. Marketing canonical URLs use the trailing-
    # slash form (`/about/`); both URLs resolve to the same page, and
    # <link rel="canonical"> in each page's <head> tells search engines
    # which one to index.
