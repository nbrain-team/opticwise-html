# Render Blueprint for the OpticWise static site.
# This repo is a pre-built Next.js static export (no build step required at deploy).
# Spec: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: opticwise-html
    runtime: static
    branch: main
    buildCommand: 'true'
    staticPublishPath: ./
    autoDeploy: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=()
      # Hashed/immutable bundles
      - path: /_next/static/*
        name: Cache-Control
        value: 'public, max-age=31536000, immutable'
      - path: /api/media/file/*
        name: Cache-Control
        value: 'public, max-age=31536000, immutable'
      # Other static assets
      - path: /images/*
        name: Cache-Control
        value: 'public, max-age=86400'
